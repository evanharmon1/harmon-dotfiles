name: Build & Validate

on:
  push:
    branches:
      - main
  # No `edited`: it fires on a PR title/body edit, and the dev loop's readiness
  # gate REQUIRES body edits (ticking `## Deferred findings`), so carrying it
  # here made satisfying one gate condition invalidate another — every
  # settlement restarted the whole matrix. `edited` also fires on a
  # base-BRANCH change; dropping that re-run is deliberate. Retargeting a PR
  # is rare, and a strict required-status-checks policy already forces an
  # up-to-date head before merge, which lands as a `synchronize` this list
  # does cover. Title/body-dependent guards keep `edited` in their OWN
  # workflows: closing-keywords.yml.
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  merge_group:
  workflow_dispatch:

# Parallel jobs that all call into the Taskfile so local + CI run identical commands.
# A final `verify` job aggregates statuses for branch protection
# (required checks: verify + security). Every job's toolchain setup goes through
# the shared ./.github/actions/setup composite action.

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so `task check`'s pin-pair guard can diff against the
          # PR's merge-base: it is the only check that catches a Renovate bump
          # that moved a tool's version but not its checksum, and it fails
          # rather than skipping on a pull request without that history.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          lint-tools: "true"
      - name: Lint
        run: task check
      # Outside the suite: `audit:*` is not a `test:*` target, so `test:suite`
      # does not carry it, and `verify` runs it between `check` and the suite.
      - run: task audit:agent-instructions
      # Its own step, outside the suite it guards: it is also a suite member (so
      # `verify` runs it), but deleting the suite step below would delete the
      # only CI step that could notice — this one still fails then.
      - name: Verify-CI parity guard (runs outside the suite it guards)
        run: task test:verify-ci-parity
      # The ONE step for every `test:*` target `task verify` runs. The list
      # lives in Taskfile.yml's `test:suite` and nowhere else, so a check added
      # to `verify` can no longer be missed here (harmon-init#962, #1461) —
      # each entry carries the same answer gate in both places.
      # `test:verify-ci-parity` (the step above) fails if this step is ever
      # dropped.
      #
      # `validate` renders every chezmoi template (#49) and needs the pinned
      # chezmoi that `lint-tools` installs, so it runs here.
      #
      # NOT here, deliberately: `test`. It is in `verify` unconditionally, but
      # CI only invokes it from the build-test job, which is gated on
      # use_node. So a repo with
      # `(include_terraform or include_ansible) and not use_node` runs real
      # terraform/ansible checks locally and none in CI. Adding it here is
      # not a one-liner — `terraform validate` needs an init step CI does not
      # have — so it is tracked as harmon-init#978 rather than fixed in the
      # same breath.
      - run: task validate
      - name: Test suite (every test:* target verify runs)
        run: task test:suite
      # Outside the suite, on purpose: a NETWORK check (`verify` stays offline).
      - name: Skills drift check (vendored skills vs pinned harmon-devkit ref)
        run: task verify:skills

  security:
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          gitleaks: "true"
      - name: Secrets scan
        run: task security:secrets
      - name: Dependency audit
        run: task security:audit
      - name: SAST (Semgrep Community Edition)
        run: task security:sast

  verify:
    if: always()
    needs: [lint, security]
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      # Never check out or run fork-controlled repository code on this path.
      - name: Verify deliberate skips at the untrusted-fork boundary
        if: env.IS_FORK == 'true'
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          fail=0
          check_skipped() {
            if [ "$2" != "skipped" ]; then
              echo "Job $1 result: $2 (expected skipped for an untrusted fork)"
              fail=1
            fi
          }
          check_skipped lint "$LINT_RESULT"
          check_skipped security "$SECURITY_RESULT"
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Untrusted fork trust boundary enforced: all repository-controlled jobs were deliberately skipped."
      - if: env.IS_FORK != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify required jobs succeeded
        if: env.IS_FORK != 'true'
        env:
          EXPECTED_RESULT: success
          LINT_RESULT: ${{ needs.lint.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: ./scripts/verify-ci-results.sh "lint=${LINT_RESULT}" "security=${SECURITY_RESULT}"
# Keep a literal final line after the inline Jinja conditionals above; with
# trim_blocks enabled, ending on a block tag would strip the workflow's EOF newline.
